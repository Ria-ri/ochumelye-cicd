name: CI/CD Pipeline

on:
  push:
    branches: [ dev, uat, main ]
  pull_request:
    branches: [ dev, uat, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy .env.ci to .env
        run: cp .env.ci .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests with coverage
        run: |
          ./vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text > coverage-text.log
          COVERAGE=$(grep -oP 'Lines: \K\d+\.\d+' coverage-text.log | head -1)
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 50%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% is OK"

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --error-format=github --no-progress

      - name: Linting (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Simulate deploy
        if: success()
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            cp .env.dev .env
            echo "Deploying to DEV with .env.dev"
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            cp .env.uat .env
            echo "Deploying to UAT with .env.uat"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            cp .env.prod .env
            echo "Deploying to PRODUCTION with .env.prod"
          else
            echo "No deployment for branch ${{ github.ref_name }}"
          fi
          php artisan config:cache
          echo "✅ Deployment simulation completed."