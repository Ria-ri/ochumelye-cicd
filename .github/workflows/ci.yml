name: CI/CD Pipeline

on:
  push:
    branches: [ dev, uat, main ]
  pull_request:
    branches: [ dev, uat, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy .env.ci to .env
        run: cp .env.ci .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests with coverage
        run: |
          ./vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text > coverage-text.log
          COVERAGE=$(grep -oP 'Lines: \K\d+\.\d+' coverage-text.log | head -1)
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 50%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% is OK"

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --error-format=github --no-progress

      - name: Linting (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Simulate deploy (only if previous steps succeeded)
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            cp .env.dev .env
            echo "Deploying to DEV with .env.dev"
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            cp .env.qa .env
            echo "Deploying to QA with .env.qa"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            cp .env.prod .env
            echo "Deploying to PRODUCTION with .env.prod"
          else
            echo "No deployment for branch ${{ github.ref_name }}"
          fi
          php artisan config:cache
          echo "✅ Deployment simulation completed."

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref_name == 'main' || github.ref_name == 'master'
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Manual approval required
        run: echo "Manual approval step – deployment to PRODUCTION"

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-production]
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📢 Pipeline ${{ job.status }} for branch ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Repository: ${{ github.repository }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true